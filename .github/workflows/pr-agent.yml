name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: >-
    ${{
      (
        (
          github.event_name == 'pull_request'
          && github.event.sender.type != 'Bot'
          && github.event.pull_request.head.repo.full_name == github.repository
        )
        || (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && github.event.comment.user.type != 'Bot'
          && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
          && (
            startsWith(github.event.comment.body, '/describe')
            || startsWith(github.event.comment.body, '/review')
            || startsWith(github.event.comment.body, '/improve')
            || startsWith(github.event.comment.body, '/ask')
          )
        )
      )
      && format('pr-agent-{0}', github.event.pull_request.number || github.event.issue.number)
      || format('noop-{0}', github.run_id)
    }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      (
        github.event_name == 'pull_request'
        && github.event.sender.type != 'Bot'
        && github.event.pull_request.head.repo.full_name == github.repository
      )
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        && (
          startsWith(github.event.comment.body, '/describe')
          || startsWith(github.event.comment.body, '/review')
          || startsWith(github.event.comment.body, '/improve')
          || startsWith(github.event.comment.body, '/ask')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Review pull request
        uses: docker://pragent/pr-agent@sha256:162427075a59d581c9dbb6fe856864bdd564ce2580433b6122deed0ed9b59a17 # 0.43.0-github_action
        env:
          OPENAI_KEY: ${{ secrets.AI_REVIEW_OPENAI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          config.response_language: fa-IR
          github_action_config.auto_describe: "true"
          github_action_config.auto_review: "true"
          github_action_config.auto_improve: "false"
          github_action_config.handle_push_trigger: "true"
          github_action_config.push_commands: '["/review"]'
