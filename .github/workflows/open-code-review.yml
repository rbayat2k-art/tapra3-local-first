name: OpenCodeReview (manual)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: >-
    ${{
      (
        github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        && (
          startsWith(github.event.comment.body, '/open-code-review')
          || startsWith(github.event.comment.body, '@open-code-review')
        )
      )
      && format('open-code-review-{0}', github.event.issue.number)
      || format('noop-{0}', github.run_id)
    }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.issue.pull_request
      && github.event.comment.user.type != 'Bot'
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      && (
        startsWith(github.event.comment.body, '/open-code-review')
        || startsWith(github.event.comment.body, '@open-code-review')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve pull request
        id: pr-context
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const pullRequest = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('base_ref', pullRequest.data.base.ref);
            core.setOutput('head_sha', pullRequest.data.head.sha);

      - name: Run OpenCodeReview
        uses: alibaba/open-code-review@66120291271b2e605e420e9f11fbd6448f06163f # v1.9.10
        with:
          ocr_version: "1.9.10"
          llm_url: https://api.openai.com/v1/chat/completions
          llm_auth_token: ${{ secrets.AI_REVIEW_OPENAI_KEY }}
          llm_model: gpt-5.6
          llm_use_anthropic: "false"
          base_ref: ${{ steps.pr-context.outputs.base_ref }}
          head_sha: ${{ steps.pr-context.outputs.head_sha }}
          rule: .opencodereview/rule.json
          review_concurrency: "3"
          sticky_summary: "true"
          incremental: "true"
          upload_artifacts: "false"
