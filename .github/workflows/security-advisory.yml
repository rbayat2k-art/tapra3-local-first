name: security-advisory

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-advisory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scanners:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # Advisory during baseline/triage. Remove continue-on-error only after findings are classified.
      - name: Semgrep static analysis
        continue-on-error: true
        run: |
          python -m pip install --disable-pip-version-check semgrep==1.172.0
          semgrep scan --config p/default --error --metrics=off src/local-foundation

      - name: Trivy dependency, misconfiguration, and secret scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          version: v0.72.0

      - name: Gitleaks full-history secret scan
        continue-on-error: true
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/repo"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          detect --source=/repo --no-banner --redact --exit-code=1
